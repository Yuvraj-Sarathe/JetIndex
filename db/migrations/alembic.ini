# Alembic configuration for JetIndex (APIx)
# Invoke from the project root with:
#   alembic -c db/migrations/alembic.ini upgrade head
#
# The sqlalchemy.url below is a placeholder — db/migrations/env.py overrides it
# with app.core.config.settings.DATABASE_URL at runtime.

[alembic]
script_location = %(here)s
prepend_sys_path = .
# sqlalchemy.url is set programmatically in env.py
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
