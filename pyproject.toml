[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jetindex"
version = "0.1.0"
description = "APIx — Real-time Airfare Price Index for India"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy>=2",
    "psycopg[binary]",
    "alembic",
    "celery[redis]",
    "redis",
    "flower",
    "curl_cffi",
    "playwright",
    "playwright-stealth",
    "fake-useragent",
    "polars",
    "numpy",
    "scipy",
    "pandas",
    "pyyaml",
    "httpx",
    "python-dotenv",
    "loguru",
    "tenacity",
    "scikit-learn",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "*.md",
    "*.json",
    "*.csv",
    "*.yaml",
    "*.yml",
    "frontend/",
    "data/",
    "slides/",
    "demo/",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = [
    "B008",  # FastAPI Depends/Query in function args — standard pattern
    "E501",  # line-too-long (long f-strings)
    "N806",  # non-lowercase-variable-in-function (X is ML convention)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: tests requiring external services (DB, network)",
]

[tool.setuptools.packages.find]
include = ["app*", "scrapers*", "pipeline*", "engine*", "db*"]
